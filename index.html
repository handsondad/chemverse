<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="ChemVerse 化学视界：从元素与分子到反应原理、虚拟实验和工业化学，通过图解与交互式 3D 动画学习化学。">
    <title>ChemVerse 化学视界 · 交互式化学学习</title>
</head>
<body>

    <div class="bg-animation" aria-hidden="true"></div>

    <main class="app-content" id="app-content">
    <div class="rotate-hint" id="rotate-hint">💡 横屏查看效果更佳</div>

    <div class="control-panel">
        <div class="title-box">
            <h1 id="main-title">元素周期表</h1>
        </div>
        
        <div class="mode-group" role="group">
            <button type="button" class="mode-btn active" data-mode="default" id="mode-standard" aria-pressed="true">标准</button>
            <button type="button" class="mode-btn" data-mode="radius" id="mode-radius" aria-pressed="false">半径</button>
            <button type="button" class="mode-btn" data-mode="en" id="mode-electronegativity" aria-pressed="false">电负性</button>
            <button type="button" class="mode-btn" data-mode="ip" id="mode-ionization" aria-pressed="false">电离能</button>
            <button type="button" class="mode-btn" data-mode="melt" id="mode-melting" aria-pressed="false">熔点</button>
            <button type="button" class="mode-btn" data-mode="boil" id="mode-boiling" aria-pressed="false">沸点</button>
            <button type="button" class="mode-btn" data-mode="density" id="mode-density" aria-pressed="false">密度</button>
        </div>

        <div class="language-toggle" role="group">
            <button type="button" class="lang-btn active" id="lang-zh" aria-pressed="true">中文</button>
            <button type="button" class="lang-btn" id="lang-en" aria-pressed="false">EN</button>
        </div>

        <div class="search-box">
            <label class="sr-only" id="search-label" for="searchInput">查找元素</label>
            <input type="text" id="searchInput" placeholder="查找元素...">
        </div>
    </div>

    <div class="legend-wrapper">
        <div class="legend" id="legend" role="group"></div>
    </div>

    <div class="table-wrapper">
        <div class="periodic-table" id="table" role="region"></div>
    </div>
    </main>

    <!-- 主信息弹窗 -->
    <div class="modal-overlay" id="modal" aria-hidden="true" inert>
        <div class="hologram-card" role="dialog" aria-modal="true" aria-labelledby="m-name" tabindex="-1">
            <button type="button" class="close-btn" id="modal-close">&times;</button>
            
            <!-- 左侧：原子可视化 -->
            <div class="atom-visualizer" id="atomWrapper" tabindex="0">
                <button type="button" class="expand-btn" title="放大查看">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                    </svg>
                </button>
                <div class="atom-container" id="atomContainer"></div>
                <div class="visualizer-hint" id="visualizer-hint">拖拽旋转视角</div>
            </div>
            
            <!-- 右侧：信息面板 -->
            <div class="info-panel">
                <!-- 头部信息 -->
                <div class="header-row">
                    <div class="big-symbol" id="m-symbol">Fe</div>
                    <div class="header-details">
                        <div class="big-name">
                            <span id="m-name">铁</span>
                            <span id="m-en-name" class="en-name">Iron</span>
                        </div>
                        <div class="header-meta">
                            <span class="category-tag" id="m-cat">过渡金属</span>
                            <span class="phase-tag" id="m-phase">固体</span>
                            <span class="block-tag" id="m-block">d</span>
                        </div>
                    </div>
                </div>

                <!-- 简介 -->
                <div class="summary-box" id="m-summary-box">
                    <p id="m-summary"></p>
                </div>

                <!-- 标签页导航 -->
                <div class="tab-nav" role="tablist">
                    <button type="button" class="tab-btn active" id="tab-basic" role="tab" aria-selected="true" aria-controls="pane-basic">基础</button>
                    <button type="button" class="tab-btn" id="tab-physical" role="tab" aria-selected="false" aria-controls="pane-physical" tabindex="-1">物理</button>
                    <button type="button" class="tab-btn" id="tab-chemical" role="tab" aria-selected="false" aria-controls="pane-chemical" tabindex="-1">化学</button>
                    <button type="button" class="tab-btn" id="tab-history" role="tab" aria-selected="false" aria-controls="pane-history" tabindex="-1">历史</button>
                    <button type="button" class="tab-btn" id="tab-media" role="tab" aria-selected="false" aria-controls="pane-media" tabindex="-1">媒体</button>
                </div>

                <!-- 标签页内容 -->
                <div class="tab-content">
                    <!-- 基础信息 -->
                    <div class="tab-pane active" id="pane-basic" role="tabpanel" aria-labelledby="tab-basic">
                        <div class="info-section">
                            <h3 id="electron-config-label">电子排布</h3>
                            <div class="config-box">
                                <div class="config-text" id="m-config"></div>
                                <div class="config-semantic" id="m-config-semantic"></div>
                                <div class="config-shell" id="m-config-shell"></div>
                            </div>
                        </div>

                        <div class="info-section">
                            <h3 id="valence-label">常见化合价</h3>
                            <div class="valence-tags" id="m-valence"></div>
                        </div>

                        <div class="info-section">
                            <h3 id="isotopes-label">同位素 (● 稳定)</h3>
                            <div class="isotope-tags" id="m-isotopes"></div>
                        </div>

                        <div class="info-section">
                            <h3 id="position-label">周期表位置</h3>
                            <div class="props-grid props-grid-4">
                                <div class="prop-item"><label id="period-label">周期</label><span id="m-period">4</span></div>
                                <div class="prop-item"><label id="group-label">族</label><span id="m-group">8</span></div>
                                <div class="prop-item"><label id="block-label">区块</label><span id="m-block-val">d</span></div>
                                <div class="prop-item"><label id="atomic-num-label">原子序数</label><span id="m-num">26</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- 物理性质 -->
                    <div class="tab-pane" id="pane-physical" role="tabpanel" aria-labelledby="tab-physical" hidden>
                        <div class="info-section">
                            <h3 id="appearance-label">外观</h3>
                            <p class="appearance-text" id="m-appearance"></p>
                        </div>

                        <div class="info-section">
                            <h3 id="physical-props-label">物理性质</h3>
                            <div class="props-grid">
                                <div class="prop-item"><label id="atomic-mass-label">相对原子质量</label><span id="m-mass">55.845</span></div>
                                <div class="prop-item"><label id="atomic-radius-label">原子半径 (pm)</label><span id="m-radius">126</span></div>
                                <div class="prop-item"><label id="density-label">密度 (g/cm³)</label><span id="m-density">7.874</span></div>
                                <div class="prop-item"><label id="melting-point-label">熔点 (K)</label><span id="m-melt">1811</span></div>
                                <div class="prop-item"><label id="boiling-point-label">沸点 (K)</label><span id="m-boil">3134</span></div>
                                <div class="prop-item"><label id="molar-heat-label">摩尔热容 (J/mol·K)</label><span id="m-molar-heat">25.1</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- 化学性质 -->
                    <div class="tab-pane" id="pane-chemical" role="tabpanel" aria-labelledby="tab-chemical" hidden>
                        <div class="info-section">
                            <h3 id="chemical-props-label">化学性质</h3>
                            <div class="props-grid">
                                <div class="prop-item"><label id="electronegativity-label">电负性 (鲍林)</label><span id="m-en">1.83</span></div>
                                <div class="prop-item"><label id="electron-affinity-label">电子亲和能 (kJ/mol)</label><span id="m-ea">15.7</span></div>
                            </div>
                        </div>

                        <div class="info-section">
                            <h3 id="ionization-energies-label">电离能 (kJ/mol)</h3>
                            <div class="ionization-list" id="m-ionization-list"></div>
                        </div>
                    </div>

                    <!-- 历史发现 -->
                    <div class="tab-pane" id="pane-history" role="tabpanel" aria-labelledby="tab-history" hidden>
                        <div class="info-section">
                            <h3 id="discovery-label">发现</h3>
                            <div class="history-item">
                                <label id="discovered-by-label">发现者</label>
                                <span id="m-discovered-by">—</span>
                            </div>
                            <div class="history-item">
                                <label id="named-by-label">命名者</label>
                                <span id="m-named-by">—</span>
                            </div>
                        </div>

                        <div class="info-section">
                            <h3 id="source-label">参考资料</h3>
                            <a class="source-link" id="m-source" href="#" target="_blank" rel="noopener noreferrer">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                    <polyline points="15 3 21 3 21 9"/>
                                    <line x1="10" y1="14" x2="21" y2="3"/>
                                </svg>
                                <span id="source-link-text">Wikipedia</span>
                            </a>
                        </div>
                    </div>

                    <!-- 媒体资源 -->
                    <div class="tab-pane" id="pane-media" role="tabpanel" aria-labelledby="tab-media" hidden>
                        <!-- 实物图片 -->
                        <div class="info-section">
                            <h3 id="image-label">实物图片</h3>
                            <div class="media-container" id="image-container">
                                <button class="load-media-btn" id="load-image-btn">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                        <circle cx="8.5" cy="8.5" r="1.5"/>
                                        <polyline points="21 15 16 10 5 21"/>
                                    </svg>
                                    <span id="load-image-text">加载实物图片</span>
                                </button>
                                <div class="image-display" id="image-display" style="display:none;">
                                    <img id="element-image" src="" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">
                                    <p class="image-caption" id="image-caption"></p>
                                </div>
                            </div>
                        </div>

                        <!-- 玻尔模型图片 -->
                        <div class="info-section">
                            <h3 id="bohr-image-label">玻尔模型图</h3>
                            <div class="media-container" id="bohr-image-container">
                                <button class="load-media-btn" id="load-bohr-image-btn">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"/>
                                        <circle cx="12" cy="12" r="6"/>
                                        <circle cx="12" cy="12" r="2"/>
                                    </svg>
                                    <span id="load-bohr-image-text">加载玻尔模型图</span>
                                </button>
                                <div class="image-display" id="bohr-image-display" style="display:none;">
                                    <img id="bohr-image" src="" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 放大原子视图弹窗 -->
    <div class="expanded-atom-overlay" id="expandedAtomModal" aria-hidden="true" inert>
        <div class="expanded-atom-card" role="dialog" aria-modal="true" aria-labelledby="expanded-name" tabindex="-1">
            <button type="button" class="close-btn" id="expanded-close">&times;</button>
            <div class="expanded-atom-header">
                <span class="expanded-atom-symbol" id="expanded-symbol">Fe</span>
                <span class="expanded-atom-name" id="expanded-name">铁 Iron</span>
            </div>
            <div class="expanded-atom-wrapper" id="expandedAtomWrapper" tabindex="0">
                <div class="expanded-atom-container" id="expandedAtomContainer"></div>
            </div>
            <div class="expanded-atom-info">
                <div class="shell-legend" id="expanded-shell-legend"></div>
                <div class="expanded-hint" id="expanded-hint">拖拽旋转 · 滚轮缩放</div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
